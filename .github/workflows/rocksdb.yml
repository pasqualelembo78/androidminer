name: Build RocksDB for Android

on:
  workflow_dispatch:   # Avvio manuale dal tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "23.1.7779620"
      ANDROID_API: "24"
      ABI: "arm64-v8a"
      ROCKSDB_VERSION: "8.12.0"  # Puoi cambiare versione

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: android-actions/setup-ndk@v2
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ wget unzip

      - name: Download RocksDB
        run: |
          wget -q https://github.com/facebook/rocksdb/archive/refs/tags/v${{ env.ROCKSDB_VERSION }}.zip -O rocksdb.zip
          unzip -q rocksdb.zip
          mv rocksdb-${{ env.ROCKSDB_VERSION }} rocksdb

      - name: Create build directories
        run: |
          mkdir -p rocksdb/build-android rocksdb/out/$ABI

      - name: Configure CMake
        run: |
          cd rocksdb/build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ env.ABI }} \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DROCKSDB_BUILD_SHARED=OFF \
            -DROCKSDB_BUILD_UTILITIES=OFF \
            -DROCKSDB_BUILD_TESTS=OFF \
            -DROCKSDB_BUILD_BENCHMARKS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../out/${{ env.ABI }}

      - name: Build RocksDB
        run: |
          cd rocksdb/build-android
          cmake --build . -- -j$(nproc)
          cmake --install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-android-${{ env.ABI }}
          path: rocksdb/out/${{ env.ABI }}
