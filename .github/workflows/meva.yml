name: Build Mevacoin Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: r23c
      ANDROID_API: 24
      BOOST_ROOT: $HOME/boost-android

    steps:
      - name: Checkout Mevacoin repository
        uses: actions/checkout@v4
        with:
          repository: pasqualelembo78/mevacoin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Boost artifacts from previous workflow
        uses: actions/download-artifact@v4
        with:
          name: boost-android
          path: $HOME/boost-android

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar bzip2 build-essential python3 cmake unzip git

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          mv android-ndk-${ANDROID_NDK_VERSION} $HOME/android-ndk
          echo "NDK path: $HOME/android-ndk"

      - name: Setup environment for cross-compilation
        run: |
          export ANDROID_NDK=$HOME/android-ndk
          export PATH=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=aarch64-linux-android${ANDROID_API}-clang
          export CXX=aarch64-linux-android${ANDROID_API}-clang++

      - name: Configure CMake for Mevacoin
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DBOOST_ROOT=$BOOST_ROOT \
            -DBOOST_INCLUDEDIR=$BOOST_ROOT/include \
            -DBOOST_LIBRARYDIR=$BOOST_ROOT/lib \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Mevacoin
        run: |
          cd build
          cmake --build . -- -j$(nproc)

      - name: Upload Mevacoin Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: mevacoin-android
          path: build
          retention-days: 30
