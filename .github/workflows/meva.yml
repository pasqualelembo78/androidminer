name: Build Mevacoin Android ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_NDK_VERSION: r23c
      ANDROID_API: 24
      BOOST_ROOT: $HOME/boost-android
      BOOST_ZIP_URL: https://github.com/pasqualelembo78/androidminer/releases/download/Boos/boost-android.zip

    steps:
      - name: Checkout Mevacoin repository
        uses: actions/checkout@v4
        with:
          repository: pasqualelembo78/mevacoin
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip build-essential python3 cmake git ninja-build

      - name: Download and extract precompiled Boost
        run: |
          mkdir -p $BOOST_ROOT
          wget -O boost.zip $BOOST_ZIP_URL
          unzip -q boost.zip -d $BOOST_ROOT
          ls -R $BOOST_ROOT | head -n 30

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          mv android-ndk-${ANDROID_NDK_VERSION} $HOME/android-ndk

      - name: Configure CMake for Mevacoin
        run: |
          mkdir -p build && cd build
          cmake .. \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$HOME/android-ndk/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${ANDROID_API} \
            -DBOOST_ROOT=$BOOST_ROOT \
            -DBOOST_INCLUDEDIR=$BOOST_ROOT/include \
            -DBOOST_LIBRARYDIR=$BOOST_ROOT/lib \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Mevacoin
        run: |
          cd build
          cmake --build . -- -j$(nproc)

      - name: Upload Mevacoin Android binaries
        uses: actions/upload-artifact@v4
        with:
          name: mevacoin-android
          path: build
          retention-days: 30
